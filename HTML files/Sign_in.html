<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | UMAK Co-op</title>
  <link rel="stylesheet" href="../CSS files/Sign_in.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html" aria-label="UMAK Co-op home">
      <span class="brand-mark">U</span>
      <span>UMAK Co-op</span>
    </a>
  </header>

  <main class="signin-layout">
    

    <section class="signin-card" aria-labelledby="signin-title">
      <div class="card-heading">
        <div>
          <p class="step-label">Member access</p>
          <h2 id="signin-title">Sign in to UMAK Co-op</h2>
        </div>
        <span class="card-dot" aria-hidden="true"></span>
      </div>

      <form class="signin-form" action="#" method="post">
        <div class="form-group">
          <label class="form-label" for="email">Gmail account</label>
          <input class="form-input" id="email" name="email" type="email" placeholder="you@gmail.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>

        <div class="password-row">
          <a class="help-link" href="OTP.html">Forgot password?</a>
        </div>

        <a href="OTP.html">
            <button class="submit-button" type="button">Sign in <span aria-hidden="true">→</span></button>
        </a>
        <div class="divider" aria-hidden="true">or</div>
        <button class="google-button" type="button">Continue with Google</button>
      </form>

      <p class="signup-prompt">Don’t have an account? <a class="signup-link" href="Sign_up.html">Create account</a></p>
    </section>
  </main>
</body>
</html>
